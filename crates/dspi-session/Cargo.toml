[package]
name = "dspi-session"
description = "Connect, discover, read and write DSPi device state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dspi-proto.workspace = true
dspi-transport.workspace = true
thiserror.workspace = true
serde_json.workspace = true
serde = { workspace = true }

[features]
default = ["serde", "bundled-autoeq"]
# About 5 MB of the binary. Off for a build where that matters, such as an
# armv7 Pi; a user-supplied database still works without it.
bundled-autoeq = []
serde = ["dspi-proto/serde"]
