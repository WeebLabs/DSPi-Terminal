name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,      cross: false }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl,     cross: true  }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu,     cross: true  }
          - { os: ubuntu-latest,  target: armv7-unknown-linux-gnueabihf, cross: true  }
          - { os: macos-latest,   target: aarch64-apple-darwin,          cross: false }
          - { os: macos-latest,   target: x86_64-apple-darwin,           cross: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,        cross: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          BIN=target/${{ matrix.target }}/release/dspi
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          cp "$BIN" dist/
          cp README.md dist/
          # The udev rule matters on Linux and is harmless elsewhere; shipping it
          # in every archive means the fix is always to hand.
          cp xtask/70-dspi.rules dist/
          tar -czf dspi-${{ matrix.target }}.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: dspi-${{ matrix.target }}
          path: dspi-${{ matrix.target }}.tar.gz
